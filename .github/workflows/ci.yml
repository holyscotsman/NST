# CI for the Nutanix Study Tool.
# Runs each tool's dependency-free checks: WWTBANE's unit tests, StarNix's
# build + pure logic harnesses (scheduler, grading, shuffle, timer, bank lint),
# and the Practice Exams engine harness (grading, shuffle mapping, summarize).
name: CI
on:
  push:
    branches: [main]
  pull_request:

# (QA v2.1.1) least privilege: every job only reads the checkout
permissions:
  contents: read

jobs:
  wwtbane:
    name: WWTBANE unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wwtbane
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: '22'
      # The game and its unit tests use only Node built-ins — no install needed.
      - run: node --test tests/*.test.mjs

  starnix:
    name: StarNix build + logic harnesses
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starnix
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: '22'
      # Build the single-file app (zero-dependency) and run the pure harnesses.
      # (v2.40.0) jsdom, and only jsdom. The six game suites below eval the game
      # sources inside a jsdom window; without it they cannot start, which is the
      # real reason they were never wired rather than an oversight. The app
      # itself stays dependency-free -- this is dev tooling, like the browser
      # job's playwright, and nothing here ships to a user.
      #
      # NOT canvas. starnix/package.json also declares canvas@^3 (jsdom's native
      # rendering backend), but only kbb-draw.cjs actually needs it -- measured:
      # with canvas removed, five suites and both fuzzers still pass and kbb-draw
      # fails 6 of its 16 checks. A native build in the everyday gate to buy one
      # suite is a bad trade, so kbb-draw stays excluded and named.
      #
      # The prefix is starnix/, not the workspace root, and that is not a detail.
      # Most of these harnesses require jsdom by bare name, which resolves from
      # anywhere up the tree -- but cc-death-paths.cjs requires it by ABSOLUTE
      # PATH, `require(__dirname + '/node_modules/jsdom')`, which is satisfied by
      # exactly one directory. A root install passed the bare-name check and then
      # failed on that file; both forms are verified below now.
      - name: Install jsdom for the game harnesses
        run: |
          npm install --no-save --prefix "$GITHUB_WORKSPACE/starnix" jsdom@29.1.1
          node -e "require.resolve('jsdom')" \
            || { echo "jsdom is not resolvable by bare name from starnix/"; exit 1; }
          test -d "$GITHUB_WORKSPACE/starnix/node_modules/jsdom" \
            || { echo "jsdom is not at starnix/node_modules, where cc-death-paths.cjs requires it by absolute path"; exit 1; }
      - run: node build.mjs
      - run: node bank-lint.mjs
      - run: node scheduler-test.mjs
      - run: node multi-answer-test.mjs
      - run: node shuffle-test.mjs
      - run: node timer-test.mjs
      # (v2.2.0) the rest of the dependency-free battery gates PRs too — design/test
      # drift (stale harnesses vs shipped mechanics) surfaced only locally before.
      - run: node audio-smoke.mjs
      - run: node cc-view-smoke.mjs
      - run: node cc-fairness-check.mjs
      - run: node exhibit-check.mjs
      # (v2.40.0) perf-smoke.mjs was run here without PERF=1. It exits 0 having
      # done nothing -- and this job has no browser for it anyway, so it could
      # never have run. A step that prints "skipped" while the job reports
      # success is worse than no step. It stays an opt-in pre-release tool:
      # cd starnix && PERF=1 node perf-smoke.mjs, with a Chromium installed.
      #
      # (v2.40.0) The six suites below existed, passed, and had never been run
      # by CI once. Between them they are the primary coverage for all three
      # StarNix games -- 448 checks, on the largest app in the repo.
      - run: node arm-run.cjs
      - run: node cc-run.cjs
      - run: node kbb-run.cjs
      - run: node cc-death-paths.cjs
      - run: node kbb-fuzz.cjs
      # The only fuzz coverage of the ARM flight engine, and the only harness
      # anywhere that feeds an engine random FRAME TIMES -- what a throttled or
      # backgrounded phone actually produces. Its own header calls it a harness
      # rather than a gate because the default 20 runs take ~90s; six runs is
      # ~50s and still exercises deaths, extracts and sector advances.
      - run: ARM_FUZZ_RUNS=6 node arm-fuzz.cjs
      - run: node import-questions.mjs --check
      - run: KBB_ASSERT=1 node kbb-balance.cjs
      # (v2.5.3) property fuzz: the provider must never throw, return junk, or leak
      # an exhibit into a game pool. Pure Node, no browser.
      - run: node core-fuzz.mjs

  practice-exams:
    name: Practice Exams engine harness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: practice-exams
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: '22'
      # Pure-logic harness against a shimmed window — no browser, no install.
      - run: node engine-test.mjs
      # (C8-05) release consistency: the site version and the CHANGELOG's top
      # entry must move together.
      - run: node ../scripts/version-check.mjs
      # (v2.5.1) hostile-input gate: poisoned storage + malicious bank content
      # must stay inert. Pure Node, no browser needed.
      - run: node ../scripts/security-test.mjs
      # (v2.6.0) progress backup is the only copy of a user's mastery history that
      # survives clearing browser data, and it writes to a localStorage shared with
      # every other site on the same github.io origin. Both properties are gated.
      - run: node ../scripts/backup-test.mjs
      # (v2.7.0) the shared mastery store now carries every tool's scheduling and
      # absorbs two legacy per-tool stores holding real user history, so both the
      # per-tool policies and the migration merge are gated.
      - run: node ../scripts/mastery-test.mjs
      # (v2.8.0) the VM app server is the only part that holds other people's
      # credentials and keeps one account's progress away from another's. It spawns
      # its own instance on a scratch port with a throwaway database.
      - run: node ../scripts/server-test.mjs
      # (v2.8.1) the static-file guards under BOTH Linux and Windows path
      # semantics. path.win32 implements Windows rules on any platform, so this
      # catches Windows-only path bugs from a Linux runner -- the original
      # denylist broke on Windows while every Linux test stayed green.
      - run: node ../scripts/path-guard-test.mjs
      # (v2.15.0) content encoding. Its failure modes are all invisible in the
      # happy path and break the site for one person at a time: a missing Vary
      # lets a shared cache hand brotli to a client that asked for none, and an
      # ETag that does not change with the encoding answers 304 for bytes in the
      # wrong one. Every compressed body is decompressed and compared to disk.
      - run: node ../scripts/compress-test.mjs
      # (v2.16.0) the database is the only irreplaceable thing here -- every
      # account, every password hash, everyone's history. The gate takes a
      # backup from a running server, opens it as a database and reads the rows
      # back, because a backup that cannot restore is worse than none.
      - run: node ../scripts/backup-db-test.mjs
      # (v2.19.0) account sync is the only path by which progress leaves the
      # browser it was made in, and every way it fails is silent: a request the
      # browser rejects for being too large, a push the module believes it made,
      # or an error left in a variable no surface reads.
      - run: node ../scripts/sync-test.mjs
      # (v2.20.0) the question banks and the manifest that lists them. Mastery
      # keys on the bare question id with no bank scoping, so two banks sharing
      # an id would share one record -- answering in one silently moves the
      # other's schedule. Nothing enforced unique ids and six more banks are
      # planned, so this does.
      - run: node ../scripts/bank-test.mjs
      # (v2.21.0) can a request kill the server? It runs as one Node process on a
      # VM, often started by hand rather than as a service, so a crash is not a
      # blip -- the tool is gone for everybody until someone logs in to restart
      # it. Every request may be refused; none may end the process.
      - run: node ../scripts/robustness-test.mjs
      # (v2.8.2) the one-click updater downloads code from the internet and runs
      # it as the service account. The gate asserts the source stays a constant
      # (unreachable from a request), that the staged copy is verified before the
      # live tree is touched, and that the database is never overwritten.
      - run: node ../scripts/update-test.mjs
      # (v2.9.0) the home dashboard is the first thing a returning user reads, and
      # it fails by stating something untrue rather than by crashing. The gate is
      # on the claims: no weak area that was never answered, no wall of zeros in
      # place of "not started", and a poisoned exam history yields a number.
      - run: node ../scripts/dashboard-test.mjs
      # (v2.10.0) readiness is the one number in the app that can cost someone an
      # exam fee. The gate is on its guarantees: a coverage floor before any
      # verdict, never a score below blind guessing, time can only lower the
      # estimate, and a corrupt record cannot manufacture confidence.
      - run: node ../scripts/readiness-test.mjs
      # (v2.12.0) the due-review queue. Its failure mode is a session nobody
      # finishes or one that studies the wrong thing, so the gate is on the
      # policy: overdue before new, oldest due date first, a stated cap, and a
      # queue that does not reshuffle between the count shown and the session run.
      - run: node ../scripts/review-test.mjs
      # (v2.22.0) the login layer, probed against a running server rather than
      # read. A malformed cookie answered 500 to every page including /login; an
      # unknown username skipped the scrypt and so answered 20x faster than a
      # real one, naming every account despite the identical error text; sign-up
      # had no throttle, so a loop created accounts and burned CPU without limit.
      - run: node ../scripts/auth-test.mjs
      # (v2.27.0) documentation describing a repository it no longer has. The
      # README's architecture tree listed seven top-level entries against ten
      # real ones -- server/ was missing from a file that documents the server
      # at length further down. Also checks every relative link in the docs
      # resolves, because a dead one is invisible until somebody clicks it.
      - run: node ../scripts/docs-test.mjs
      # (v2.33.0) the HTML the login server hands out. It is built by string
      # interpolation from data users control -- a username, a display name
      # chosen at self-registration -- and had no direct test. Sign up with a
      # display name of <img src=x onerror=...>, root opens /admin to see who
      # registered, and it runs in root's session. It does not happen; this is
      # what keeps a forgotten esc() from making it happen.
      - run: node ../scripts/pages-test.mjs

      # (v2.36.0) how the pages load their scripts. Every <script src> on the
      # launcher and Practice Exams was a plain blocking tag, so the browser
      # fetched them one at a time -- ten round trips end to end, and the
      # launcher painted nothing at all until the last one had run. Measured on
      # a 60ms link: 1022ms to DOMContentLoaded with no first paint before it.
      # `defer` fixed it (586ms, first paint at 316ms) and is one word that can
      # be deleted without breaking a single other test, so this gate exists.
      - run: node ../scripts/load-test.mjs

      # (v2.37.0) what happens to a browser that is ALREADY signed in. server-test
      # is thorough about who may sign in and had exactly one check on the other
      # side of it. Five actions are supposed to end a live session at once -- a
      # self password change, an admin reset, a disable, a delete, a demotion --
      # and each is one line from silently not happening, with the admin page and
      # the audit log both still claiming it did.
      - run: node ../scripts/session-test.mjs

      # (v2.40.0) the reason the six StarNix suites above went unrun for so long:
      # nothing compared what exists on disk against what CI invokes. Every
      # harness must now be either run here or on a documented exclusion list
      # with a reason -- stale, a library, a manual tool -- so the next one
      # cannot go dark silently.
      - run: node ../scripts/harness-coverage.mjs

      # (v2.45.0) the seam between one bank format and three apps. Both sides of
      # it were thoroughly tested and the conversion between them was not:
      # nothing referenced toStarNix or toWWTBANE except starnix/build.mjs. The
      # two adapters spell the answer four different ways (correctIndex,
      # correctIndices, type+answer for single, type+answer for multi), and
      # getting one wrong teaches a learner the wrong answer with confidence.
      - run: node ../scripts/adapter-test.mjs

  # (v2.23.0) The suites that need a real browser — 109 checks covering
  # accessibility (axe plus the keyboard checks axe cannot make), painted-
  # background contrast, phone and landscape layout, the DOM half of the security
  # gate, and a 15-step end-to-end journey through a real server and a real
  # login. They existed and passed, but nothing ran them except a person
  # remembering to, so those were the only parts of this repo a change could
  # break silently.
  #
  # They skip cleanly when no browser is installed, which is right on a laptop
  # and exactly wrong here: an exit 0 that ran nothing is indistinguishable from
  # 71 passing checks. NST_REQUIRE_BROWSER=1 turns that skip into a failure.
  browser:
    name: Accessibility, mobile layout and end-to-end
    runs-on: ubuntu-latest
    env:
      NST_REQUIRE_BROWSER: '1'
      # Name the axe build outright. The audit would search for it, but a search
      # that silently finds nothing is the thing this whole job exists to stop.
      AXE_PATH: ${{ github.workspace }}/node_modules/axe-core/axe.min.js
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: '22'
      # The only npm install in this repo, and it is dev tooling: nothing here
      # ships to a user. The app itself stays dependency-free.
      #
      # --prefix is not decoration. With no package.json here, npm walks UP the
      # tree looking for one and will install into a PARENT node_modules if it
      # finds it -- verified locally, where the packages landed a directory
      # above and the checkout was left empty. Name the target, then prove the
      # files are where the suites will look.
      - name: Install the dev browser tooling
        run: |
          npm install --no-save --prefix "$GITHUB_WORKSPACE" playwright@1.56.1 axe-core@4.13.0
          test -f "$AXE_PATH" || { echo "axe-core did not install to $AXE_PATH"; exit 1; }
          test -d "$GITHUB_WORKSPACE/node_modules/playwright" || { echo "playwright did not install into the checkout"; exit 1; }
      - run: npx playwright install --with-deps chromium
      # The mobile audit measures the built StarNix monolith, not its sources.
      - run: node starnix/build.mjs
      # a11y and mobile read the site over HTTP, as a browser does.
      # Redirect its output and detach it. A background process that still holds
      # the step's stdout keeps the step from ever completing -- the job would
      # hang until the six-hour timeout rather than fail.
      - name: Serve the repo on :8124
        run: |
          nohup python3 -m http.server 8124 --bind 127.0.0.1 > /tmp/static.log 2>&1 &
          disown || true
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8124/index.html && break
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:8124/index.html || { echo "static server never came up"; cat /tmp/static.log; exit 1; }
      - run: node scripts/a11y-audit.mjs
      - run: node scripts/a11y-browser.mjs
      # (v2.26.0) one preference, four front-ends, three different idioms for
      # expressing it -- shared CSS classes, a StarNix profile object, a WWTBANE
      # body class resolved through its own tri-state. Nothing checked they
      # agree, and any one of them could stop reading the key with every other
      # suite still green, while somebody who needs reduced motion gets a 3D
      # camera flight. Reads the BUILT StarNix, so it runs after build.mjs.
      - run: node scripts/prefs-test.mjs
      # (v2.29.0) an exam surviving the tab being discarded. Two things make it
      # correct rather than merely convenient: the clock is an absolute deadline
      # so resuming buys no time, and each question's option permutation is
      # replayed -- rebuilding from the bank would reshuffle and silently point
      # every stored answer at a different option.
      # (v2.32.0) "however you play, answers feed the same mastery tracker" --
      # the README's headline claim, and the reason this is one app rather than
      # three. It spans three independently-built codebases that reach the
      # shared store three different ways, and any one of them could stop with
      # every other suite still green.
      - run: node scripts/promise-test.mjs
      - run: node scripts/resume-test.mjs
      - run: node scripts/mobile-audit.mjs
      # The rendered half of the security gate: a malicious bank and poisoned
      # storage loaded into all four real pages, where security-test.mjs only
      # proves they stay inert as data.
      - run: node scripts/attack-browser.mjs
      # (v2.37.0) a dialog must never hide what it is asking you to agree to.
      # .nst-modal is capped at the viewport height and overflow:hidden, which is
      # correct only because .nst-modal-body carries the scrolling. The two
      # confirm dialogs had no body: they appended their paragraphs straight to
      # the panel, so on a short window the sentence naming what is about to be
      # permanently destroyed was clipped with no way to scroll to it. Larger
      # text -- an accessibility preference -- is what moved the threshold from a
      # window under 264px tall to one under about 340px.
      - run: node scripts/dialog-test.mjs
      # smoke-test starts its own server and its own throwaway database.
      - run: node scripts/smoke-test.mjs
