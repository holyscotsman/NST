<!doctype html><meta charset=utf-8><body style="margin:0;background:transparent">
<script type="importmap">{"imports":{"three":"/three/build/three.module.min.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
// Renders one model from one view into a transparent PNG (window.__png). Lit by a small studio built from emissive boxes,
// reflected by the metals through a PMREM environment, plus a key and a rim light.
import * as THREE from 'three';
import { loadMaterials, MODELS, rock, boxProject } from './ships.js';
const q = new URLSearchParams(location.search);
const name = q.get('model'), view = q.get('view') || 'side', S = +q.get('size') || 1024, tint = q.get('tint');
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setSize(S, S); r.setPixelRatio(1); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.1;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();

// environment: a dark room with coloured softboxes
const env = new THREE.Scene(); env.background = new THREE.Color(0x05060e);
const box = (w, h, d, col, x, y, z, I = 1) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(I) })); m.position.set(x, y, z); env.add(m); };
box(10, 0.4, 6, 0xfff2e0, 0, 8, 2, 9);        // key, top front
box(0.4, 6, 8, 0x1fdde9, 9, 1, -4, 4);        // aqua rim from the right
box(0.4, 6, 8, 0x7855fa, -9, 2, -3, 4);        // violet rim from the left
box(8, 0.3, 4, 0xffffff, 0, -8, 0, 1.5);       // faint floor bounce
box(5, 3, 0.3, 0xffc890, 0, 2, 9, 4);          // warm front fill
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(env, 0.02).texture;
const key = new THREE.DirectionalLight(0xfff0dc, 3.2); key.position.set(-3, 6, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0x6fe8ff, 0.6); rim.position.set(4, 2, -5); scene.add(rim);
scene.add(new THREE.AmbientLight(0x303050, 0.5));

const M = await loadMaterials('/tex');
const obj = name.startsWith('rock') ? rock(M, +name.slice(4)) : boxProject(MODELS[name](M), 1.1);
if (tint) obj.traverse((o) => { if (o.isMesh && o.material && o.material.map) { o.material = o.material.clone(); o.material.color.set(tint); } });
const holder = new THREE.Group(); holder.add(obj); scene.add(holder);

// frame it
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
if (view === 'side') { cam.position.set(0.0, 1.3, 9); holder.rotation.set(0.0, 0.0, 0); }
else if (view === 'sidelow') { cam.position.set(0, -1.2, 9); }
else if (view === 'top') { cam.position.set(0, 10, 0); cam.up.set(1, 0, 0); }
else if (view === 'topdown') { cam.position.set(0, 10, 0); cam.up.set(-1, 0, 0); }     // nose toward the bottom of the image
else if (view === 'iso') { cam.position.set(4.5, 5.5, 7.5); }
cam.lookAt(0, 0, 0); cam.updateMatrixWorld(true);
const bb = new THREE.Box3().setFromObject(holder);
const pts = []; for (const x of [bb.min.x, bb.max.x]) for (const y of [bb.min.y, bb.max.y]) for (const z of [bb.min.z, bb.max.z]) pts.push(new THREE.Vector3(x, y, z).applyMatrix4(cam.matrixWorldInverse));
let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9; for (const p of pts) { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); y0 = Math.min(y0, p.y); y1 = Math.max(y1, p.y); }
const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, half = Math.max(x1 - x0, y1 - y0) / 2 * 1.08;
const wide = +q.get('aspect') || 1;
cam.left = cx - half * wide; cam.right = cx + half * wide; cam.top = cy + half; cam.bottom = cy - half; cam.updateProjectionMatrix();
if (wide !== 1) r.setSize(Math.round(S * wide), S);
r.render(scene, cam);
window.__png = r.domElement.toDataURL('image/png'); window.__done = true;
</script>
